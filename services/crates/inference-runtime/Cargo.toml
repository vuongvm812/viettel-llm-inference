[package]
name    = "inference-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
disruptor     = { path = "../disruptor-rs" }
core_affinity = "0.8.1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml    = "0.9"
thiserror     = "1.0"
tokio         = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-stream  = "0.1"
axum          = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] } # ServiceExt::oneshot in HTTP tests
