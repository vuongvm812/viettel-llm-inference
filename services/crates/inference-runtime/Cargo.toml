[package]
name    = "inference-runtime"
version = "0.1.0"
edition = "2021"

[features]
# Real llama.cpp GPU inference (P2). Off by default: the mock backend keeps the
# crate building + testable without cmake / a GGUF model. Turn on with
# `--features llama` on a box that has the toolchain + model. Acceleration is
# picked per-OS by the target-specific dependency below (Metal on macOS, CUDA
# elsewhere), so no separate feature flag is needed for the accelerator.
llama = ["dep:llama-cpp-2"]

[dependencies]
disruptor     = { path = "../disruptor-rs" }
core_affinity = "0.8.1"
serde         = { version = "1", features = ["derive"] }
sonic-rs      = "0.5"   # SIMD JSON (request-body parse + SSE delta), replaces serde_json
serde_yaml    = "0.9"
thiserror     = "1.0"
tokio         = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }
tokio-stream  = "0.1"
axum          = { version = "0.7", features = ["ws"] }   # SSE (default) + WebSocket streaming (P7)

# macOS target → Metal acceleration.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.150", features = ["metal"], optional = true }

# Everything else (Linux deploy box) → CUDA.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.150", features = ["cuda"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] } # ServiceExt::oneshot in HTTP tests
# Real-socket WebSocket client for the /v1/ws streaming test (P7). rt-multi-thread lets the
# test run the server + egress drain + client concurrently (the runtime the binary uses is
# single-thread current-thread; the test needs true parallelism to avoid a cooperative stall).
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
