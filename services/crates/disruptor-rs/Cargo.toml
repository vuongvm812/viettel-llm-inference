[package]
name          = "disruptor"
version       = "4.3.0"
edition       = "2021"
description   = "Low latency inter-thread communication via a ringbuffer (inspired by the LMAX Disruptor)."
license       = "MIT"
authors       = ["Nicholas <nicholassm@gmail.com>"]
repository    = "https://github.com/nicholassm/disruptor-rs"
categories    = ["data-structures", "concurrency"]
keywords      = ["disruptor", "ringbuffer", "message", "mpmc"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossbeam-utils = "0.8"
core_affinity   = "0.8.1"
thiserror       = "1.0"
# For the `lossy` module (relocated, verified seqlock SPMC ring).
# Optional: gated behind the `lossy` feature. `ring-core` is a missing sibling
# crate we don't use, so `lossy` stays off by default (see ROADMAP P0).
ring-core       = { path = "../ring-core", optional = true }
bytemuck        = { version = "1", optional = true }

[features]
lossy = ["dep:ring-core", "dep:bytemuck"]

[dev-dependencies]
criterion = "0.5"
crossbeam = "0.8"
bytemuck = { version = "1", features = ["derive"] }
loom = "0.7"

[lints.rust]
# `cfg(loom)` gates the lossy ring's loom model-checking build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "poller"
harness = false

[[bench]]
name = "counters"
harness = false
