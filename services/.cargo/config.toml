# P6 build optimization (docs/design/build-optimization/design.md).
# target-cpu=native emits code tuned for the build/deploy box CPU. For a portable
# artifact, pin an explicit arch (e.g. -Ctarget-cpu=x86-64-v3) instead.
#
# NOTE: cargo discovers this file from the invocation cwd (walking up), NOT from
# --manifest-path. Build from inside services/ (build-pgo-bolt.sh does) for it to
# apply. The PGO passes pass -Ctarget-cpu=native explicitly in RUSTFLAGS, since an
# env RUSTFLAGS overrides (does not merge with) build.rustflags here.
[build]
rustflags = ["-C", "target-cpu=native"]
