[workspace]
resolver = "2"
members = [
    "crates/disruptor-rs",
    "crates/inference-runtime",
]

# P6 build optimization (docs/design/build-optimization/design.md). Fat LTO gives
# whole-program inlining across crates (incl. the vendored disruptor); one codegen
# unit maximizes opt at the cost of build parallelism; panic=abort drops unwind
# tables from the hot path. strip=false keeps symbols — BOLT and `perf` need them
# (strip after BOLT if desired). Only [profile.release] is affected; `cargo test`
# uses the dev/test profiles and stays unwind-safe.
# NB (deliberate availability/latency trade): under panic=abort a handler panic
# aborts the whole process — there is NO per-task unwind isolation, so a panic in
# one request drops every in-flight stream, and Core 0's mutex-poison recovery
# (core0::lock) is a dev/test-only safety net in release. Accepted because it drops
# unwind tables from the hot path and client paths are audited panic-free. A tower
# catch_panic layer canNOT restore isolation here — catch_unwind never fires under
# abort; the only lever is switching THIS profile back to panic="unwind", which
# forfeits the saving. Revisit if the deploy needs per-request fault isolation.
[profile.release]
lto           = "fat"
codegen-units = 1
panic         = "abort"
opt-level     = 3
strip         = false
