name: VPS GPU

# The contest chain: build -> test -> bench, in ONE dispatch on the box that has the GPU.
#
# VPS-scoped CI, deliberately separate from the three legacy workflows (build-push / bench /
# bootstrap), which stay pinned to the rtx3060 dev box and untouched -- the known-good path is
# not coupled to the untested contest topology. Everything VPS lives in `vps-*` workflow files
# (GitHub reads .github/workflows/ flat, so a filename prefix is the "directory"),
# .github/runner/vps/ for the runner, and scripts/ci/ for the shared shims.
#
# This replaces a build-push -> copy the digest by hand -> bench dance that would otherwise be
# repeated for three days.
#
# Manual trigger on purpose. There is one GPU; firing on push would produce benchmark numbers
# taken while another job was running, which is worse than no numbers because they look fine.

on:
  workflow_dispatch:
    inputs:
      round:
        description: 'Round directory'
        required: true
        default: 'round-2'
        type: string
      runner_label:
        description: 'Self-hosted runner label (h200 | rtx3060)'
        required: true
        default: 'h200'
        type: string
      stages:
        description: 'Comma list: build,test,bench'
        required: true
        default: 'build,test,bench'
        type: string
      cuda_archs:
        # NO DEFAULT, deliberately. HANDOFF 4.1: without an explicit list nvcc probes the build
        # host (which has no GPU) and guesses, and a mismatch does NOT degrade gracefully --
        # dlopen succeeds, the override installs, and the first launch dies with
        # cudaErrorNoKernelImageForDevice. Making it required means nobody inherits a stale value.
        #   '9.0+PTX'      submission / H200 only
        #   '8.6;9.0+PTX'  fat, so one artifact runs on the rtx3060 dev box AND the H200
        description: 'CUDA archs for nvcc, e.g. 9.0+PTX'
        required: true
        type: string
      image_digest:
        description: 'Bench a pinned digest instead of the locally built :dev (sha256:...)'
        required: false
        default: ''
        type: string

# One GPU per label. Without this, two dispatches land on the same card and BOTH benches are
# wrong -- silently, because each run looks perfectly healthy in isolation.
# cancel-in-progress is false: a half-killed bench leaves a running container, not a clean slate.
concurrency:
  group: gpu-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  gpu:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 150
    env:
      ROUND: ${{ inputs.round }}
      # NO VTL_EXEC here, deliberately -- workflow env would SHADOW the runner's environment.
      # The transport comes from whichever runner picked the job up: the VPS runner
      # (.github/runner/vps/) sets nothing and exec.sh defaults to `local`; the laptop jump
      # runner (.github/runner/jump/) exports VTL_EXEC=ssh + VTL_GPU_HOST + VTL_SSH_OPTS as
      # container env, which job steps inherit. Registering the runner IS choosing the topology;
      # this file is byte-identical in both cases.

    steps:
      - uses: actions/checkout@v4

      # --- build ---------------------------------------------------------------------------
      # buildx --load tags the image :dev locally. No push: in Case 1 the runner that builds is
      # the runner that benches, so the image never has to leave the box. `make push` stays a
      # separate, deliberate act for pinning a submission digest.
      - name: Build
        if: contains(inputs.stages, 'build')
        run: scripts/ci/exec.sh make build ROUND="$ROUND" CUDA_ARCHS='${{ inputs.cuda_archs }}'

      # --- test ----------------------------------------------------------------------------
      # Runs pytest inside the image against ours AND stock (VTL_SKIP_EXT=1). Agreeing with the
      # same oracle is what proves a kernel port; a suite that only ever runs our own kernels
      # proves the kernel is self-consistent, which is not the claim.
      - name: Kernel tests
        if: contains(inputs.stages, 'test')
        run: scripts/ci/exec.sh make test-kernel ROUND="$ROUND" CUDA_ARCHS='${{ inputs.cuda_archs }}'

      # --- bench ---------------------------------------------------------------------------
      - name: Preflight
        if: contains(inputs.stages, 'bench')
        run: scripts/ci/exec.sh scripts/ci/preflight.sh "$ROUND"

      - name: Start server
        if: contains(inputs.stages, 'bench')
        run: scripts/ci/exec.sh make ci-up ROUND="$ROUND" IMAGE_DIGEST='${{ inputs.image_digest }}'

      # Greps the boot log for the things that fail SILENTLY: plugin loaded, quant registered,
      # layers actually quantized, fusion pass replaced a nonzero number of patterns, jemalloc
      # preloaded, rust scheduler engaged. Every one of these can be wrong on a server that
      # serves perfectly well and benches perfectly badly.
      - name: Verify boot
        if: contains(inputs.stages, 'bench')
        run: scripts/ci/exec.sh make verify ROUND="$ROUND"

      - name: Bench
        if: contains(inputs.stages, 'bench')
        run: scripts/ci/exec.sh make bench ROUND="$ROUND" TARGET=http://localhost:8000

      # Not wrapped in exec.sh: pure Python over JSON that exec.sh has already rsynced back, so
      # it belongs on the runner. if: always() so a partial bench still reports what it got.
      - name: Report
        if: always() && contains(inputs.stages, 'bench')
        working-directory: ${{ inputs.round }}
        run: |
          {
            echo "### Bench — \`${ROUND}\` on \`${{ inputs.runner_label }}\`"
            echo ""
            echo '```'
            python3 bench/_ci_report.py 2>&1 || echo "(no usable bench output)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bench JSON
        if: always() && contains(inputs.stages, 'bench')
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.round }}-${{ inputs.runner_label }}-${{ github.run_id }}
          path: |
            ${{ inputs.round }}/bench-open.json
            ${{ inputs.round }}/bench-closed-*.json
          if-no-files-found: warn

      # Always, and tolerant: a stack left running holds the GPU and makes the NEXT job's
      # preflight fail, which is a confusing way to discover this one crashed.
      - name: Stop server
        if: always() && contains(inputs.stages, 'bench')
        run: scripts/ci/exec.sh make ci-down ROUND="$ROUND" || true
