name: viettel-llm-ci-jump

# Self-hosted runner for the LAPTOP JUMP HOST (Case 2): the VPS cannot reach github.com, only this
# laptop can. The runner lives here; every GPU command hops to the VPS over SSH via
# scripts/ci/exec.sh. Still outbound long-poll only toward GitHub -- no inbound ports.
#
#   VTL_GPU_HOST=user@vps VTL_SSH_KEY=./key GH_PAT=... \
#     docker compose -f docker-compose.runner.yaml up -d
#
# SAME `h200,sm90,gpu` LABELS AS THE VPS RUNNER, on purpose. The label names the GPU the work
# TARGETS, not the machine the runner sits on. Because the workflows' concurrency group keys on
# the label (`gpu-h200`), one lock per physical GPU holds even if both runners are registered --
# and failover is automatic: whichever runner is alive takes the job, and either produces a
# correct run. The extra `jump` label is observability only (see which runner took a job); it
# does not affect matching. Day 0 is "start the runner that can reach GitHub", not "edit CI".
#
# THE SEAL: this runner sits on the machine that gets sealed overnight. Dispatches queue while it
# is offline and drain at unseal -- cancel stale queued jobs before dispatching fresh ones, or the
# morning goes to benches nobody is waiting for. `restart: unless-stopped` makes it rejoin on
# power-up without anyone remembering to start it.
#
# DAY-0 SMOKE TEST, before any dispatch -- prove the hop from INSIDE the container:
#   docker compose -f docker-compose.runner.yaml exec runner \
#     env VTL_EXEC=ssh VTL_GPU_HOST=<user@vps> VTL_SSH_OPTS='-i /ssh/key -o StrictHostKeyChecking=accept-new' \
#     ssh -o BatchMode=yes -i /ssh/key <user@vps> true
services:
  runner:
    # The stock image is not guaranteed to ship the three things the jump path needs ON the
    # runner itself: rsync + ssh for exec.sh's transport, python3 for the stdlib-only
    # bench/_ci_report.py report step. Everything heavier runs on the VPS.
    build:
      dockerfile_inline: |
        FROM myoung34/github-runner:ubuntu-22.04
        RUN apt-get update && apt-get install -y --no-install-recommends \
              rsync openssh-client python3 \
            && rm -rf /var/lib/apt/lists/*
    restart: unless-stopped
    volumes:
      # Dedicated deploy key for the VPS hop, NOT a ~/.ssh mount (container uid mismatches make
      # OpenSSH reject keys it thinks are foreign). chmod 600 the file on the host; it is
      # gitignored (.github/runner/jump/key). VTL_SSH_OPTS below carries the -i.
      - ${VTL_SSH_KEY:?path to the private key for the VPS hop}:/ssh/key:ro
      # NO docker socket, deliberately. This runner never runs docker locally -- every build,
      # test and bench happens on the VPS over SSH -- so it does not get the host's daemon.
    environment:
      REPO_URL: https://github.com/vuongvm812/viettel-llm-inference
      ACCESS_TOKEN: ${GH_PAT}
      RUNNER_SCOPE: repo
      # Non-ephemeral: nothing heavy is cached here (no docker), but re-registration on every job
      # is pure churn on a venue network.
      EPHEMERAL: 0
      LABELS: h200,sm90,gpu,jump
      # The transport, inherited by every job step. vps-gpu.yml deliberately does NOT set
      # VTL_EXEC (workflow env would shadow this) -- registering this runner IS choosing the
      # jump topology. accept-new instead of strict host checking: first contact with the VPS
      # happens at the venue, and there is no pre-shared known_hosts to pin against.
      VTL_EXEC: ssh
      VTL_GPU_HOST: ${VTL_GPU_HOST:?user@vps for the GPU box}
      VTL_REMOTE_DIR: /opt/vtl-ci
      VTL_SSH_OPTS: -i /ssh/key -o StrictHostKeyChecking=accept-new
