# Default runtime configuration for inference-runtime.
# Loaded by main() from cwd; override with `inference-runtime <path>`.

# Core 0 — Web I/O & streaming
server:
  host: "0.0.0.0"
  port: 8000            # matches the vLLM baseline (docker-compose)

# Model backend — llama.cpp via FFI.
# Qwen3.5-2B dense transformer, BF16 (unquantized). Converted from the HF
# safetensors to a BF16 GGUF (convert_hf_to_gguf.py --outtype bf16); see script/setup.sh.
model:
  gguf_path: "/model"   # bind-mounted GGUF (docker-compose), matching the baseline mount point.
                        # For local `make run/inference` use a config with a relative path (e.g. recurrent-test.yaml).
  n_ctx: 262144         # 256K context, baseline parity
  n_threads: 1          # full GPU offload → 1 CPU thread
  n_gpu_layers: -1      # -1 = offload all layers

# Disruptor serving fabric
runtime:
  max_inflight: 256     # RequestSlab size = max concurrent requests (queue depth)
  ring_size: 1024       # power of two; R1 (multi-producer) needs >= 64
  # llama.cpp partitions n_ctx across parallel sequences: each seq gets n_ctx / max_batch_seqs
  # cells. A request whose prompt+gen exceeds that slice fails at decode with NoKvCacheSlot.
  # Trace-round1's largest request is ~30-48K tokens, so per-seq must be >= ~48K:
  #   262144 / 4 = 65536 per seq. Raise concurrency only if the workload's max request shrinks
  #   (concurrency x per_seq <= n_ctx is VRAM-bound). Also capped by LLAMA_MAX_SEQ=256.
  max_batch_seqs: 4     # P3: max sequences decoded together per iteration (clamped to max_inflight)
  max_batch_tokens: 2048 # P3: per-iteration prompt-token budget for admission (must be <= per-seq context)
  shared_prefix_tokens: 0 # P4: shared-prefix KV reuse. DISABLED pending verification that seq_cp
                          # is valid for this hybrid model's recurrent (DeltaNet) state cells, not
                          # just its attention KV. If it works, it frees per-seq context → higher concurrency.
  # --- latency knobs (all output-preserving unless noted) ---
  kv_defrag_thold: 0.1    # Compact the copy-based KV cache once ~10% of cells are stale holes.
                          # Continuous batching retires seqs mid-context; defrag reclaims cells so a
                          # long-running server doesn't drift toward slot exhaustion. <=0 disables.
  n_ubatch: 0             # Physical micro-batch (tokens per forward pass). 0 = match n_batch (one
                          # ubatch/step → lower TTFT on long prompts + stable shape for CUDA graphs).
                          # Clamped to n_batch at load.
  flash_attention: auto   # auto|on|off. "auto" leaves llama.cpp's default → byte-identical to today.
                          # Flash attn can change the attention reduction order (may break byte-parity)
                          # and some DeltaNet/recurrent layers don't support it — run `make parity-flash`
                          # on the GPU box and confirm identical output before setting "on".
  cores:                # pinned core ids (no-op on macOS)
    web_io: 0
    text: 1
    fast_loop: 2
