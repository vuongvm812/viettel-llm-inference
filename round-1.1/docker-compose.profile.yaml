# Phase-0 profiling overlay -- do NOT submit. This build's vLLM has the torch-profiler
# endpoints/env stripped (no VLLM_TORCH_PROFILER_DIR, no /start_profile), so instead of
# vLLM's profiler we arm vtl/patches/profiler.py, which wraps GPUModelRunner.execute_model
# in the worker and dumps a chrome trace to the mounted dir. `make profile` drives it:
# boot -> wait healthy -> touch ./bench-profile/.arm -> replay load -> the worker captures
# VTL_PROFILE_STEPS steps, writes bench-profile/vtl-trace-<pid>.json, and disarms.
# Layer AFTER the localtest overlay.
services:
  model:
    environment:
      VTL_ENABLE_PROFILER: 1        # registry gate for vtl/patches/profiler.py (default OFF)
      VTL_PROFILE_DIR: /profile     # trace output + .arm trigger dir (mounted below)
      VTL_PROFILE_STEPS: 20         # execute_model calls to capture after arming
    volumes:
      - ./bench-profile:/profile
