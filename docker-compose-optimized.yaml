name: viettel-llm-optimized

# Registry-only deploy: this compose + a pushed image. No build context, no local
# mounts -- the judge host provides the model at /model and scrapes :8000.
#
# Trace-derived sizing (regenerate with `python bench/trace_stats.py`):
#   prompt tokens   min=12,919  p50=18,707  p90=27,299  max=27,331
#   max_tokens=200, temperature=0, seed=42  ->  prefill:decode = 101:1
#   6,388-token system prompt shared by all 120 requests (32% of the mean prompt)
#
# This workload is prefill-bound. Prefix caching and prefill throughput are the
# levers; speculative decoding touches only ~1% of the tokens.

services:
  model:
    image: unseenablefuture/awesome-badger:dev # submission: pin by @sha256:<digest>
    platform: linux/amd64 # H200 box is amd64; the vLLM base image is multi-arch
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - -O2
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=Qwen3.5-2B #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server

      # Longest prompt is 27,331 tokens + 200 generated = 27,531 required.
      # 16384 (baseline) rejects most of the trace; 262144 exceeds the model's
      # derived limit and vLLM refuses to start without VLLM_ALLOW_LONG_MAX_MODEL_LEN.
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95 # 0.95 leaves no headroom for CUDA graph pools
      - --tensor-parallel-size=1

      # The 6,388-token shared system prompt makes this the single biggest win:
      # ~31% of all prefill work disappears after the first request.
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=20 # KV @p50 is 0.69 GB/req -> ~174 fit in bf16; sweep this
      - --max-num-batched-tokens=16384 # prefill chunk size: TTFT vs prefill throughput

      # vtl_fp8 is registered by vtl/patches/quant_fp8.py: online FP8 W8A8 with
      # per-CHANNEL weight scales (stock fp8 is per-tensor). If that patch is
      # disabled with VTL_ENABLE_FP8=0 the name stops resolving and vLLM aborts at
      # startup -- use VTL_FP8_CHANNELWISE=0 to get stock behaviour instead.
      - --quantization=vtl_fp8
      - --kv-cache-dtype=fp8_e4m3 # halves decode KV bandwidth at 18.7K context
      - --attention-backend FLASHINFER

      # Turns on RMSNormQuantFusionPass, which rewrites the [2048]-wide
      # fused_add_rms_norm -> per-token-fp8-quant pairs (input_layernorm->in_proj/qkv and
      # post_attention_layernorm->gate_up, on both GDN and full-attn layers) into a single
      # _C::rms_norm_dynamic_per_token_quant node. (The [16]/[128]/[256] F32 per-head norms
      # are a different op and not fused here.) vtl/patches/rms_norm_quant.py replaces
      # that op's CUDA kernel with a single-pass one. Off by default because
      # enable_norm_fusion() (vllm/config/vllm.py:99) otherwise leaves the fusion to
      # Inductor -- so this swaps Inductor's Triton norm+quant for our hand-written kernel.
      # A user-set pass_config survives the -O2 defaults: _set_config_default only fills
      # fields still None (vllm/config/vllm.py:702).
      #
      # cudagraph_mode=FULL_AND_PIECEWISE: full-graph capture for pure-decode batches,
      # piecewise for prefill/mixed (required with chunked prefill + async scheduling;
      # plain FULL would fall back or error). Governs graph CAPTURE only, not FX rewriting,
      # so RMSNormQuantFusionPass and the vtl._C kernel binding are unchanged. EXPERIMENT:
      # decode is ~1% of this 101:1 trace, so upside is bounded -- keep only if ITL p50/p90
      # drops with no TTFT/throughput regression, else revert this to PIECEWISE default.
      # Re-warm (docker/cache/ was baked under PIECEWISE) and confirm the enum spelling:
      #   python3 -c "from vllm.config import CUDAGraphMode; print(list(CUDAGraphMode))"
      # fuse_act_quant runs ActivationQuantFusionPass; vtl/patches/silu_mul_quant.py adds a
      # per-token silu_and_mul->quant pattern to it so down_proj fuses into our single kernel
      # (reads gate|up once, drops the bf16 intermediate). Non-match is a no-op.
      - '--compilation-config={"pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}, "cudagraph_mode": "FULL_AND_PIECEWISE"}'
    ports:
      - "8000:8000" # judge hits this -- MUST be :8000
    environment:
      # VLLM_ATTENTION_BACKEND is deliberately unset. Forcing FLASHINFER crashed the
      # server; FA3 is auto-selected on SM90 (H200).
      VLLM_PLUGINS: vtl
      # fp8 must NOT touch the GDN linear-attention SSM path or the vision tower.
      # vtl_fp8 only upgrades LinearBase layers, so conv1d / A_log / dt_bias / per-head
      # norms are already safe (not Linear); the exposures are the tiny GDN a/b decay-beta
      # projections (in_proj_a/b [16,2048], feed the F32 SSM) and the vision-tower linears.
      # The big GDN matmuls (in_proj_qkv/z, out_proj) and the dense MLP/full-attn GEMMs stay
      # fp8. VERIFY the match semantics against v0.25.0's is_layer_skipped on the running
      # model (Phase 0): confirm these substrings actually exclude in_proj_a/b and model.visual.*
      # and that no big matmul is caught by accident.
      VTL_FP8_IGNORE: "lm_head,in_proj_a,in_proj_b,visual"
      # DEBUG makes rms_quant_fusion.py emit `fusion pass matches: {...}`, the only direct
      # evidence of how many nodes our kernel backs. `make verify` greps it. DEBUG logging
      # is not free -- leave at INFO when benchmarking or submitting.
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
      # Set to 0 to keep vLLM's stock fused kernel. The FX graph is identical either way,
      # so this toggle isolates the kernel from the fusion-pass change above.
      # A/B CAVEAT: the vtl._C .so installs ALL _C overrides (rms + dynamic-per-token) at
      # dlopen, and any enabled override-patch imports it -- so VTL_ENABLE_DYNAMIC_PER_TOKEN_QUANT=0
      # does NOT restore the stock per-token kernel while this rms patch is on. Only disabling
      # EVERY override-patch keeps stock. For true per-op A/B use the kernel tests' VTL_SKIP_EXT.
      VTL_ENABLE_RMS_NORM_QUANT: ${VTL_ENABLE_RMS_NORM_QUANT:-1}
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
