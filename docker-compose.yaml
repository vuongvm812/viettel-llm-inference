name: viettel-llm-optimized

# Registry-only deploy: this compose + a pushed image. No build context, no local
# mounts -- the judge host provides the model at /model and scrapes :8000.
#
# Trace-derived sizing (regenerate with `python bench/trace_stats.py`):
#   prompt tokens   min=12,919  p50=18,707  p90=27,299  max=27,331
#   max_tokens=200, temperature=0, seed=42  ->  prefill:decode = 101:1
#   6,388-token system prompt shared by all 120 requests (32% of the mean prompt)
#
# This workload is prefill-bound. Prefix caching and prefill throughput are the
# levers; speculative decoding touches only ~1% of the tokens.
#
# INT8 W8A8: vtl_int8 does online per-channel weight + dynamic per-token
# activation quant from the BF16 checkpoint, using stock CutlassInt8ScaledMM.
# No fused norm+quant (vLLM v0.25.0 has no INT8 fusion ops); activation quant
# runs un-fused inside the kernel's apply_weights.

services:
  model:
    image: unseenablefuture/awesome-badger@sha256:acdab1c391d58cb6561bf0405c3fc0ddec3086ab495cd47c06b6590be0d723ea # submission: re-pin by @sha256:<new digest>
    platform: linux/amd64 # H200 box is amd64; the vLLM base image is multi-arch
    entrypoint:
      - bash #Don't change this to vllm-server
      - /opt/vtl/entrypoint.sh #Don't change this to vllm-server
    command:
      - -O2
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=Qwen3.5-2B #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server

      # Longest prompt is 27,331 tokens + 200 generated = 27,531 required.
      - --max-model-len=32768
      - --gpu-memory-utilization=0.92 # headroom for CUDA graph pools during warmup
      - --tensor-parallel-size=1

      # The 6,388-token shared system prompt makes this the single biggest win:
      # ~31% of all prefill work disappears after the first request.
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # Trace sends 5 bursts of 20 requests, 25ms apart. max-num-seqs=16 queues
      # 4 per burst -> TTFT > 1500ms -> S_ttft = 0. 32 admits all 20 at once.
      # KV budget is 8x headroom (15.7GB working set vs ~120GB), so 32 is safe.
      - --max-num-seqs=32
      # 32768 tokens/step halves prefill steps vs 16384: 18700/1638 ≈ 11 vs 23.
      # TBT impact is minimal (TPOT=18ms with 45ms ceiling, 27ms headroom).
      - --max-num-batched-tokens=32768
      - --quantization=vtl_int8
      - --kv-cache-dtype=fp8_e4m3
      - --attention-backend FLASHINFER
    ports:
      - "8000:8000"
    environment:
      VLLM_PLUGINS: vtl
      VTL_INT8_IGNORE: "lm_head,in_proj_a,in_proj_b,visual"
      VTL_FP8_IGNORE: "lm_head,in_proj_a,in_proj_b,visual"
      VLLM_LOGGING_LEVEL: INFO
      # FP8 kernel overrides are off -- INT8 path doesn't use them.
      VTL_ENABLE_RMS_NORM_QUANT: 0
      VTL_ENABLE_SILU_MUL_QUANT: 0
      VTL_ENABLE_DYNAMIC_PER_TOKEN_QUANT: 0
      VTL_ENABLE_GDN_KERNELS: 0
    shm_size: "2g"
    healthcheck:
      # Don't pass until warmup completes -- the warmed marker file is touched
      # after the entrypoint script finishes sending shape-covering requests.
      test: ["CMD-SHELL", "test -f /opt/vtl/warmed && python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
