name: viettel-llm-optimized

services:
  model:
    image: unseenablefuture/awesome-badger@sha256:9cf26d062d620b53c53de7eb9d637b3b03d1486cfda7e927cfbc9a17ef78f4b2
    platform: linux/amd64
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - -O3
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --mamba_cache_mode=align
      - --enable-chunked-prefill
      - --max-num-seqs=70
      - --max-num-batched-tokens=8192
      - --max-num-scheduled-tokens=2048
      - --quantization=vtl_w4a8
      - --kv-cache-dtype=fp8_e4m3
      - --disable-log-stats
      - --uvicorn-log-level=warning
      - '--compilation-config={"pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}, "cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32]}'
    ports:
      - "8000:8000"
    environment:
      VLLM_PLUGINS: vtl
      VLLM_LOGGING_LEVEL: WARNING
      RUST_LOG: "tower_http=warn,tower=warn,axum=warn,hyper=warn,hyper_util=warn,h2=warn"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
      VTL_DISABLE: 0

      VLLM_USE_V2_MODEL_RUNNER: "1"
      VTL_V2_GREEDY_FASTPATH: "1"
      VTL_V2_GREEDY_ARGMAX_KERNEL: "0"
      VTL_V2_FUSED_POSTPROCESS: "1"
      VTL_V2_FORCE_CUTLASS_FP8: "1"

      # 3 vCPU (CFS quota). At TP=1 the executor is UniProcExecutor, which never calls
      # set_multiprocessing_worker_envs(), and a cgroup quota does not change
      # hardware_concurrency() -- so torch would size its pools to the HOST core count.
      # ACTIVE makes libgomp busy-spin after every parallel region, burning quota the
      # GIL-bound engine loop needs; at 1 thread there is nothing to spin anyway.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_WAIT_POLICY: "ACTIVE"

      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "60"
      # vllm-rs runs THREE tokio runtimes. At 3/3/3 that is 9 worker threads (plus the
      # engine-core Python threads) on a 3-vCPU quota. All three env vars are honoured:
      # tokio itself reads TOKIO_WORKER_THREADS (loom/std/mod.rs), and vllm-rs reads the
      # other two explicitly (engine-core-client/src/runtime.rs, server/src/runtime.rs).
      # HTTP keeps 2 -- bench/replay.py measures ITL from SSE deltas, so that runtime is
      # on the scored path. ZMQ runs 3 IO-bound tasks (default 4); at 1 worker the
      # recv->dispatch handoff collapses onto the tokio LIFO slot instead of waking a
      # second thread per token. Sweep ZMQ 1<->2 if TTFT regresses: one worker means a
      # large msgpack decode blocks request submission.
      TOKIO_WORKER_THREADS: "2"
      VLLM_RS_ZMQ_WORKER_THREADS: "1"
      VLLM_RS_REQUEST_WORKER_THREADS: "1"
      VLLM_RS_DISABLE_HTTP_TRACE: "1"

      VTL_W4A8_IGNORE: ""
      VTL_FP8_IGNORE: "lm_head"
      VTL_LM_HEAD_QUANT: "int4"
      # NULL, not "". A literal empty string PINS the container's value and overrides whatever
      # the host env holds -- which silently made `make sweep-schedule` a no-op: all four arms
      # booted the kernel heuristic and produced four measurements of the same thing. Null means
      # "pass through from the host env if set, omit otherwise", so an unset judge environment
      # still lands on validate_schedule(None) -> the heuristic, exactly as before.
      # This is NOT ${VAR} interpolation -- nothing here can fail to resolve at boot.
      # VTL_W4A8_SCHEDULE: ""

      VTL_ENABLE_MUL_QUANT: 1
      VTL_ENABLE_BCX_CONV_GATE: 1

      VTL_KERNEL_SYNC: 0
      VTL_DISABLE_WARMUP: 0
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "/opt/vtl/warmup_healthcheck.py"]
      interval: 10s
      timeout: 30s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
