name: viettel-llm-optimized

services:
  model:
    image: unseenablefuture/awesome-badger@sha256:08a567bf467f506e139335f3a894c0811900708861e7e88a515599e0d03180e2
    platform: linux/amd64
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - -O3
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000

      - --max-model-len=32768
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1

      - --enable-prefix-caching
      - --mamba_cache_mode=align
      - --enable-chunked-prefill
      - --max-num-seqs=70
      - --max-num-batched-tokens=8192
      - --max-num-scheduled-tokens=2048
      - --quantization=vtl_w4a8
      - --kv-cache-dtype=fp8_e4m3

      - --disable-log-stats
      - --uvicorn-log-level=warning

      - --speculative-config={"method":"draft_model","model":"LiquidAI/LFM2.5-350M","num_speculative_tokens":3,"quantization":"vtl_w4a8"}

      - '--compilation-config={"pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}, "cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32]}'
    ports:
      - "8000:8000"
    environment:
      VLLM_PLUGINS: vtl
      VLLM_LOGGING_LEVEL: WARNING

      RUST_LOG: "tower_http=warn,tower=warn,axum=warn,hyper=warn,hyper_util=warn,h2=warn"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"

      HF_HOME: /opt/hf-cache
      HF_HUB_OFFLINE: "1"
      VTL_DISABLE: 0

      VLLM_USE_V2_MODEL_RUNNER: "0"
      VTL_V2_GREEDY_FASTPATH: "1"
      VTL_V2_GREEDY_ARGMAX_KERNEL: "0"
      VTL_V2_FUSED_POSTPROCESS: "1"
      VTL_V2_FORCE_CUTLASS_FP8: "1"

      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OMP_WAIT_POLICY: "ACTIVE"

      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "60"
      TOKIO_WORKER_THREADS: "3"
      VLLM_RS_ZMQ_WORKER_THREADS: "3"
      VLLM_RS_REQUEST_WORKER_THREADS: "3"
      VLLM_RS_DISABLE_HTTP_TRACE: "1"

      VTL_W4A8_IGNORE: ""
      VTL_FP8_IGNORE: "lm_head"
      VTL_LM_HEAD_QUANT: "int4"
      VTL_DRAFT_VOCAB: "16384"

      VTL_W4A8_SCHEDULE: ""

      VTL_ENABLE_MUL_QUANT: 1
      VTL_ENABLE_BCX_CONV_GATE: 1
      VTL_BCX_SPEC: 1
      VTL_DRAFT_FULL_CUDAGRAPH: 1
      VTL_DRAFT_FUSED_ARGMAX: 1
      VTL_ENABLE_PEARL: 1
      VTL_DYNAMIC_SD_FULL_CG: 1

      VTL_KERNEL_SYNC: 0

      VTL_DISABLE_WARMUP: 0
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "/opt/vtl/warmup_healthcheck.py"]
      interval: 10s
      timeout: 30s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
