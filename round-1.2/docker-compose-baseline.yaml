services:
  model:
    image: vllm/vllm-openai:v0.25.0   # stock reference; v0.25.0 registers Lfm2ForCausalLM
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768              # phase-2 multi-turn threads reach ~25k tokens
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --mamba_cache_mode=align            # LFM2 hybrid: 'all' raises, default 'none' skips conv-state caching
      - --max-num-seqs=256                  # throughput: larger concurrent batch
      - --max-num-batched-tokens=8192       # TTFT vs throughput knob
      - --enable-chunked-prefill            # smooths decode latency under mixed load
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
