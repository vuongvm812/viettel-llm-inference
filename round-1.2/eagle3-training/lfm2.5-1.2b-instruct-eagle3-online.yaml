# EAGLE-3 online training for LFM2.5-1.2B-Instruct (SpecForge).
# Derived from examples/configs/{lfm2.5-1.2b-instruct-dflash-online (target/data),
# llama3.1-8b-eagle3-online (eagle3 strategy)}.yaml. Copy into SpecForge examples/configs/.
model:
  # Best practice = train on the SERVED distribution. If you can point SGLang at the W4A8 build,
  # do so; otherwise bf16 LFM2.5-1.2B is the standard first pass (note the small quant shift).
  target_model_path: "LiquidAI/LFM2.5-1.2B-Instruct"
  draft_model_config: "configs/lfm2.5-1.2b-instruct-eagle3.json"
  # Online (disaggregated) requires an explicit shared vocab mapping (producer+consumer must agree).
  # Generate it with scripts/prepare_hidden_states.py (writes vocab_mapping/vocab_mapping.pt), then
  # point here. See README step 2.
  vocab_mapping_path: cache/vocab_mapping/lfm2.5-1.2b-eagle3.pt
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 4096          # matches the judge trace's ~4k context
  chat_template: "lfm"      # registered in specforge/data/template.py:123
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000          # append `training.max_steps=200` on the CLI for a smoke run
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7             # EAGLE-3 training-time-test multi-step rollout
  attention_backend: "sdpa"
  save_interval: 1000
  log_interval: 10
  dist_timeout: 20
  seed: 0
run_id: "lfm2.5-1.2b-instruct-eagle3-online"
output_dir: "./outputs/lfm2.5-1.2b-instruct-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1        # single GPU; bump for data-parallel consumers
  disaggregated:
    control_dir: outputs/lfm2.5-1.2b-instruct-eagle3-online/control
    consumer_state_dir: outputs/lfm2.5-1.2b-instruct-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
