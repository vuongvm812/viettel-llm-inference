services:
  # Our optimized inference-runtime (PGO+LTO+BOLT). Build the binary first:
  # `make dist/optimized`, then `docker compose build inference` / `up`.
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: linhthuydanhbo1234/inference-runtime:release
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the GGUF at /model (baseline mount convention). Our llama.cpp runtime
      # needs a GGUF — do NOT override with the baseline's safetensors /model.
      - ./models/qwen3.5-2b-bf16.gguf:/model:ro
    cpuset: "${INFERENCE_CPUSET:-0-2}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
