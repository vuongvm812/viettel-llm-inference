services:
  model:
    image: vllm/vllm-openai:v0.25.0   # v0.22.1 can't load qwen3_5 (VL hybrid); v0.25.0 registers it
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=Qwen3.5-2B #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=16384              # match real workload (prompt+output), NOT 256K — biggest throughput lever
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --max-num-seqs=256                  # throughput: larger concurrent batch
      - --max-num-batched-tokens=8192       # TTFT vs throughput knob
      - --enable-chunked-prefill            # smooths decode latency under mixed load
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
