# LOCAL boot-test overlay — do NOT submit this. The judge populates /model itself;
# this just bind-mounts a stand-in HF model so the vLLM compose can start on your box.
# Usage:
#   docker compose -f docker-compose-optimized.yaml -f docker-compose.localtest.yaml up
services:
  model:
    volumes:
      - ./model:/model:ro   # HF safetensors dir (config.json + *.safetensors), NOT the .gguf
